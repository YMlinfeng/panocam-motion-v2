project:
  random_seed: 20260817
  duration_seconds: 15.0
  fps: 20
  max_pixels: 921600
  combo_recipe_count: 45
  sequential_cases: 45
  simultaneous_cases: 45
  tiny_planet_cases: 5
  rabbit_hole_cases: 5

# 每个尺寸都必须是偶数，并且 width * height <= 921600。
# 列表故意混合横屏、竖屏、方形和超宽比例；同一个 case 的 ref/target 一定使用同一尺寸。
resolutions:
  - [1280, 720]
  - [720, 1280]
  - [960, 960]
  - [1104, 832]
  - [832, 1104]
  - [1440, 640]
  - [640, 1440]
  - [1344, 672]
  - [1072, 856]
  - [856, 1072]

render:
  codec: libx264
  crf: 22
  preset: medium
  maxrate: 2400k
  bufsize: 4800k
  pixel_format: yuv420p
  ffmpeg_threads: 2

screening:
  min_duration_seconds: 16.0
  min_width: 3840
  min_height: 1920
  min_fps: 20.0
  audit_window_seconds: 15.0
  audit_stride_seconds: 30.0
  max_windows_per_source: 5
  sample_count_per_window: 15
  analysis_width: 512
  analysis_height: 256
  pixel_difference_threshold: 10
  dynamic_score_min: 0.006
  global_flow_px_max: 1.8
  coherent_shift_px_max: 10.0

trajectory:
  # 普通 rectilinear 视角的基础水平 FOV；竖屏会自动降低 HFOV，避免垂直 FOV 过宽。
  base_hfov_deg: 86.0
  max_vertical_fov_deg: 95.0
  hard_hfov_min_deg: 36.0
  hard_hfov_max_deg: 108.0
  hard_yaw_center_abs_deg: 90.0
  hard_pitch_abs_deg: 62.0
  hard_roll_abs_deg: 45.0
  seam_margin_deg: 25.0
  pan_amplitude_deg: [38.0, 72.0]
  tilt_amplitude_deg: [22.0, 44.0]
  roll_amplitude_deg: [12.0, 28.0]
  # Zoom 幅度刻意小于旧版，避免极端 FOV 导致严重拉伸或倒置错觉。
  zoom_amplitude_deg: [6.0, 13.0]
  simultaneous_min_overlap_ratio: 0.55
  # >1 表示更快。每个动作会在此范围随机取值，并写入 CASE_PLAN，之后可逐条修改。
  speed_multiplier_range: [1.05, 1.40]
  # 顺序组合中，每个动作只占自己时间段的这一比例；余下时间保持结果。越小越快。
  sequential_motion_fraction: 0.78

source_roots:
  # 公开仓库克隆到其他位置后，可在命令行用 --source-root-360x / --source-root-commons 覆盖。
  360x: ../panocam/data/dataset_showcase/360x/hr_samples
  commons: ../panocam/data/panos

# manual_decision 的优先级高于算法阈值：只用于已经逐条目视确认的内容规则。
sources:
  - {dataset: 360x, file: 019cc67f-512f-4b8a-96ef-81f806c86ce1.mp4, manual_decision: pass, note: 室内固定机位，人物动态}
  - {dataset: 360x, file: 02594cd1-c13c-4fbe-a804-f8d8c72ca409.mp4, manual_decision: reject, note: 车厢随列车移动，不属于静止机位}
  - {dataset: 360x, file: 02692940-fd94-4af1-8ebc-577acacc617a.mp4, manual_decision: pass, note: 商场餐区固定机位，人群动态}
  - {dataset: 360x, file: 03498a23-90d7-4428-bd12-45f88a323419.mp4, manual_decision: pass, note: 寺庙广场固定机位，人群动态}
  - {dataset: 360x, file: 034f05a8-6069-4756-8a97-d6b8bd5aceb6.mp4, manual_decision: reject, note: 动态分数过低，近似静止画面}
  - {dataset: 360x, file: 047054e3-0024-407d-be1b-ee1236f8a0fe.mp4, manual_decision: pass, note: 街头固定机位，人物动态}
  - {dataset: 360x, file: 0488c75c-b0a5-4e95-943f-17a909fc68a9.mp4, manual_decision: pass, note: 夜市固定机位，人群动态}
  - {dataset: 360x, file: 05a3f507-7d57-4797-9345-cc2b10894d76.mp4, manual_decision: pass, note: 户外固定机位，人群动态}
  - {dataset: 360x, file: 05e84dbf-6eaa-47d6-9b82-8ed75ee5d66c.mp4, manual_decision: pass, note: 农田固定机位，人物动态}
  - {dataset: 360x, file: 06eeb914-a805-479e-be3f-8157c95190b5.mp4, manual_decision: pass, note: 草地固定机位，人物动态}
  - dataset: commons
    file: 360_Video_of_LCS-15_Christening_and_Launch.webm
