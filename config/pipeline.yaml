project:
  random_seed: 20260819
  duration_seconds: 15.0
  fps: 20
  max_pixels: 921600
  combo_recipe_count: 45
  hybrid_a_cases: 45
  hybrid_b_cases: 45
  tiny_planet_cases: 5
  rabbit_hole_cases: 5

# 每个尺寸都必须是偶数，并且 width * height <= 921600。
# 列表故意混合横屏、竖屏、方形和超宽比例；同一个 case 的 ref/target 一定使用同一尺寸。
resolutions:
  - [1280, 720]
  - [720, 1280]
  - [960, 960]
  - [1104, 832]
  - [832, 1104]
  - [1440, 640]
  - [640, 1440]
  - [1344, 672]
  - [1072, 856]
  - [856, 1072]

render:
  codec: libx264
  crf: 22
  preset: medium
  maxrate: 2400k
  bufsize: 4800k
  pixel_format: yuv420p
  ffmpeg_threads: 2

screening:
  min_duration_seconds: 16.0
  # 3600×1800 的 ERP 在约 90° 视角下仍能提供约 900 个有效横向源像素，足够
  # 生成本项目的 720P 级输出；低于这个值的候选仍会被拒绝。
  min_width: 3600
  min_height: 1800
  min_fps: 20.0
  audit_window_seconds: 15.0
  audit_stride_seconds: 30.0
  # 增加每个长视频的候选窗口，减少 100 个 pair 中重复使用同一 15 秒片段。
  max_windows_per_source: 8
  sample_count_per_window: 15
  analysis_width: 512
  analysis_height: 256
  pixel_difference_threshold: 10
  dynamic_score_min: 0.006
  # 相邻抽样帧若超过 42% 像素发生显著变化，通常是剪辑切镜而非场景主体运动。
  scene_cut_dynamic_ratio_max: 0.42
  global_flow_px_max: 1.8
  coherent_shift_px_max: 10.0

trajectory:
  # 普通 rectilinear 视角的基础水平 FOV；竖屏会自动降低 HFOV，避免垂直 FOV 过宽。
  base_hfov_deg: 86.0
  max_vertical_fov_deg: 95.0
  hard_hfov_min_deg: 36.0
  hard_hfov_max_deg: 108.0
  hard_yaw_center_abs_deg: 112.0
  hard_pitch_abs_deg: 72.0
  # Roll 不改变视角中心经度，允许 360°/540°/720° 大幅滚转。
  hard_roll_abs_deg: 720.0
  seam_margin_deg: 18.0
  pan_amplitude_deg: [72.0, 155.0]
  tilt_amplitude_deg: [42.0, 92.0]
  roll_amplitude_deg: [95.0, 420.0]
  # Zoom 幅度刻意小于旧版，避免极端 FOV 导致严重拉伸或倒置错觉。
  # 比上一版略大，但仍受 36°～108° HFOV 硬边界约束。
  zoom_amplitude_deg: [6.0, 12.0]

  # 每个混合时序 case 都有一个覆盖整条 15 秒的 backbone 动作；其他动作使用互相
  # 错开的短/中/长时间窗叠加其上。因此镜头始终运动，不再存在顺序段之间的停顿。
  backbone_start_seconds: 0.0
  backbone_end_seconds: 15.0
  short_duration_seconds: [0.55, 2.20]
  medium_duration_seconds: [2.20, 6.50]
  long_duration_seconds: [6.50, 13.50]
  fast_action_probability: 0.72
  medium_action_probability: 0.20
  # speed_multiplier 同时影响采样出的动作时长和 whip 曲线陡峭度；>1 更快。
  speed_multiplier_range: [0.75, 3.60]
  fast_speed_multiplier_range: [1.80, 3.60]
  whip_probability: 0.34
  large_whip_probability: 0.18
  spin_360_amplitude_deg: [360.0, 720.0]
  whip_duration_seconds: [0.50, 1.45]
  whip_pan_amplitude_deg: [85.0, 165.0]
  whip_tilt_amplitude_deg: [60.0, 115.0]
  action_start_latest_seconds: 12.5
  min_start_separation_seconds: 0.35
  stationary_speed_threshold_deg_per_second: 0.50
  max_stationary_run_frames: 1
  high_speed_threshold_deg_per_second: 25.0

  # 动作数 >=3 时，至少两条非 backbone 动作会共同覆盖这个时长区间；加上
  # backbone，即同一时刻至少有 3 种运镜叠加。
  simultaneous_overlap_seconds: [2.5, 5.0]
  simultaneous_action_fraction: 0.80

  # 特殊投影使用完整 360°，额外叠加持续滚转和轻微呼吸式 Zoom。
  special_roll_total_deg: [220.0, 540.0]
  special_zoom_percent: [0.025, 0.070]
  special_zoom_cycles: [1.0, 2.5]

source_roots:
  # 公开仓库克隆到其他位置后，可在命令行用 --source-root-360x / --source-root-commons 覆盖。
  360x: ../panocam/data/dataset_showcase/360x/hr_samples
  commons: local/sources/commons
  commons_still: local/sources/commons_still

